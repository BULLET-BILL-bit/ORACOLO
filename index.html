<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>L'Oracolo</title>

    <style>
        body {
            background-color: #111;
            color: #eee;
            font-family: Georgia, serif;
            text-align: center;
            padding: 60px 20px;
        }

        .simbolo {
            font-size: 32px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 42px;
            letter-spacing: 6px;
            margin-bottom: 10px;
        }

        .sottotitolo {
            font-style: italic;
            color: #aaa;
            margin-bottom: 50px;
        }

        .oggi {
            font-size: 14px;
            letter-spacing: 4px;
            color: #888;
            margin-bottom: 25px;
        }

        .profezia {
            font-size: 24px;
            line-height: 1.6;
            max-width: 700px;
            margin: 0 auto 50px auto;
        }

        .firma {
            color: #777;
            font-size: 14px;
            letter-spacing: 2px;
        }
    </style>
</head>


<body>

    <div class="simbolo">✦</div>

    <h1>L'ORACOLO</h1>

    <div class="sottotitolo">
        Il futuro è già stato scritto.
    </div>

    <div class="oggi">
        OGGI
    </div>

    <div class="profezia" id="profezia">
        Consultando il destino...
    </div>

    <div class="firma">
        ✧ L'Oracolo ha parlato ✧
    </div>


    <script>

        // IDENTITÀ DEL BROWSER
        let oracoloID = localStorage.getItem("oracoloID");

        if (!oracoloID) {
            oracoloID = Math.floor(Math.random() * 1000000000);
            localStorage.setItem("oracoloID", oracoloID);
        }


        // DATA DI OGGI
        const oggi = new Date();

        const data =
            oggi.getFullYear() * 10000 +
            (oggi.getMonth() + 1) * 100 +
            oggi.getDate();


        // SEME DEL DESTINO
        const seme = data + Number(oracoloID);


        // GENERATORE PSEUDO-CASUALE DETERMINISTICO
        let stato = seme >>> 0;

        function casuale() {
            stato = (stato * 1664525 + 1013904223) >>> 0;
            return stato / 4294967296;
        }


        // MAZZO 1 — SOGGETTO
        const mazzo1 = [
            "Il Destino",
            "La brama di conoscenza",
            "Una persona sconosciuta",
            "Una persona che conosci",
            "Uno straniero venuto dal mare",
            "Qualcuno che lavora con te",
            "Qualcuno che non vedi da tanto",
            "Qualcuno alle tue spalle",
            "La tua stessa mente",
            "La persona che vedrai per prima",
            "La terza persona che saluterai",
            "Una voce fallace",
            "Un'ombra fugace",
            "Il tu del passato",
            "Una persona che credevi un'altra persona"
        ];


        // MAZZO 2 — VERBO
        const mazzo2 = [
            "troverà per te",
            "ti farà perdere",
            "ti farà conoscere",
            "ti farà dimenticare",
            "celerà ai tuoi sensi",
            "ti donerà",
            "ti porterà a scoprire",
            "darà rovina a",
            "andrà a braccetto con",
            "ti permetterà di evitare",
            "ti farà dubitare di",
            "non è detto che porti a",
            "potrebbe volerti parlare di",
            "ti metterà in difficoltà attraverso",
            "ti mentirà su"
        ];


        // MAZZO 3 — COMPLEMENTO OGGETTO
        const mazzo3 = [
            "una moneta sfortunata",
            "una chiave a lungo cercata",
            "una fotografia ancora da scattare",
            "un segreto a lungo mantenuto",
            "una risposta chiara e precisa",
            "un messaggio oscuro e velato",
            "un sentimento dirompente",
            "qualcosa di molto vicino",
            "qualcosa di davvero lontano",
            "un'idea abbandonata ma mai dimenticata",
            "qualcosa che non appartiene a nessuno",
            "un giorno di festa",
            "un'eco difficile da catturare",
            "un te del futuro",
            "qualcuno che credevi qualcun altro"
        ];


        // MAZZO 4 — COMMENTO
        const mazzo4 = [
            "Non indossare rosso, bianco o nero.",
            "Controlla spesso l'orario, ma non dargli peso.",
            "Era inevitabile.",
            "Questo non era previsto.",
            "Prendilo come un avvertimento.",
            "Interessante.",
            "Non è una coincidenza.",
            "Potrebbe andare peggio.",
            "Guardati dalla pioggia.",
            "Finalmente.",
            "Non guardarti alle spalle.",
            "Smetti di inseguire ciò che non puoi raggiungere.",
            "Che cosa potrebbe mai andare storto?",
            "Questo spiega molte cose.",
            "Non credere a niente di ciò che ti dirà."
        ];


        // ESTRAZIONE DA UN MAZZO
        function scegli(mazzo) {
            const indice = Math.floor(casuale() * mazzo.length);
            return mazzo[indice];
        }


        // COMPOSIZIONE DELLA PROFEZIA
        const profezia =
            scegli(mazzo1) + " " +
            scegli(mazzo2) + " " +
            scegli(mazzo3) + "... " +
            scegli(mazzo4);


        // VISUALIZZAZIONE
        document.getElementById("profezia").textContent = profezia;


        // DEBUG
        console.log("ID Oracolo:", oracoloID);
        console.log("Data:", data);
        console.log("Seme:", seme);
        console.log("Profezia:", profezia);

    </script>

</body>

</html>
